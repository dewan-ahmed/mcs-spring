spring:
  application:
    name: notify-worker
  main:
    web-application-type: none
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    root: INFO
    io.github.dewanahmed.notify: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

notify:
  app-environment: ${APP_ENVIRONMENT:local}
  worker:
    synthetic-interval: 30s
