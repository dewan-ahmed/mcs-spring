server:
  port: 5081

spring:
  application:
    name: notify-public-api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    io.github.dewanahmed.notify: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

notify:
  app-environment: ${APP_ENVIRONMENT:local}
  security:
    api-key: ${NOTIFY_API_KEY:}
